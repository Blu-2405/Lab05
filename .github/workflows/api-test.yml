name: API Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Newman
      run: npm install -g newman

    - name: Run Collection
      run: |
        newman run Collection.json \
        -e Environment.json \
        -d users.csv \
        --env-var token=72577c27b4e4d53c63f9e84942ad70f8c139ee8a6bafd5055acdb669dcd75011
